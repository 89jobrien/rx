[package]
name = "rx-install"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace    = true
keywords.workspace   = true
categories.workspace = true
description = "Install compatible scripts from local directories, files, and URLs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.39", features = ["derive"] }
clap_complete = "4"
clap_complete_nushell = "4"
rx-core = { path = "../rx-core", version = "0.1.0" }
rx-registry-json = { path = "../rx-registry-json", version = "0.1.0" }
comfy-table = "7.1.4"
num_cpus = "1.16.0"
serde_json = "1.0.145"
shell-words = "1.1.0"
toml = "0.9.8"

[dev-dependencies]
assert_cmd = "2.0.16"
tempfile = "3.23.0"

[[bin]]
name = "rx"
path = "src/main.rs"
