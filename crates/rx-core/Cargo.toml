[package]
name = "rx-core"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Core domain logic for rx: script runtime detection, repo discovery, and filtering"

[features]
test-support = ["dep:tempfile"]

[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
tempfile = { version = "3.23.0", optional = true }
toml = "0.9.8"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.23.0"
serde_json = "1.0.145"
proptest = "1.6.0"
